<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เลือกทริป — Tabi เที่ยวญี่ปุ่น</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="topbar">
  <a href="index.html" class="brand">旅 <span>Tabi</span> — เที่ยวญี่ปุ่น</a>
  <div class="topnav">
    <a href="index.html">1. เข้าสู่ระบบ</a>
    <a href="select.html" class="on">2. เลือกทริป</a>
    <a href="detail.html">3. รายละเอียด</a>
    <a href="package.html">4. แพ็กเกจ</a>
  </div>
</div>

<div class="page" id="page-select">
  <div class="wrap">
    <svg class="bg-decor" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <g stroke="#e79fb0" stroke-width="2" fill="none">
        <path d="M190,10 C160,30 140,60 120,90 C100,120 80,140 50,160"/>
        <path d="M120,90 C110,70 100,60 85,55"/>
        <path d="M100,120 C90,105 78,98 65,96"/>
      </g>
      <g fill="#f4c6d0">
        <circle cx="85" cy="55" r="5"/><circle cx="65" cy="96" r="5"/>
        <circle cx="50" cy="160" r="6"/><circle cx="120" cy="90" r="5"/><circle cx="190" cy="10" r="5"/>
      </g>
    </svg>

    <a href="index.html" class="back-link reveal">← กลับไปหน้าเข้าสู่ระบบ</a>

    <div class="page-head reveal select-head-row">
      <div>
        <div class="step-dots">
          <span class="step-dot on"><span class="dot-num">1</span>เลือกทริป</span>
          <span class="step-line"></span>
          <span class="step-dot"><span class="dot-num">2</span>รายละเอียด</span>
        </div>
        <h2>เลือกทริปของคุณ</h2>
      </div>
      <button class="btn-surprise" id="btnSurprise">🎲 สุ่มทริปเซอร์ไพรส์</button>
    </div>
    <div class="seigaiha"></div>

    <div class="layout-2col">
      <div>
        <div class="section-title reveal dest-title-row">
          <span><span class="sec-ic">📍</span>อยากไปที่ไหนในญี่ปุ่น</span>
          <div class="view-toggle" id="destViewToggle">
            <button data-view="card" class="on">🔳 การ์ด</button><button data-view="map">🗾 แผนที่</button>
          </div>
        </div>
        <div class="season-filter reveal" id="seasonFilter"></div>
        <div class="dest-grid" id="destGrid"></div>
        <div class="japan-map-wrap" id="japanMapWrap" style="display:none;"></div>

        <div class="section-title reveal"><span class="sec-ic">🏨</span>เลือกที่พัก</div>
        <div class="hotel-list" id="hotelList"></div>

        <div class="section-title reveal"><span class="sec-ic">🚄</span>การเดินทาง</div>
        <div class="transport-grid" id="transportGrid"></div>
      </div>

      <div>
        <div class="side-card reveal" style="margin-bottom:16px;">
          <h3>เลือกวันเดินทาง</h3>
          <div class="cal-head">
            <button id="calPrev">‹</button>
            <span id="calMonthLabel"></span>
            <button id="calNext">›</button>
          </div>
          <div class="cal-grid" id="calGrid"></div>
          <div class="cal-range-label" id="calRangeLabel">แตะวันที่เริ่มต้น แล้วแตะวันที่สิ้นสุดการเดินทาง</div>
          <div class="countdown-label" id="countdownLabel"></div>
        </div>

        <div class="side-card reveal">
          <div class="card-head-row"><h3>สรุปเบื้องต้น</h3>
            <div class="currency-toggle" id="currencyToggle1">
              <button data-cur="THB" class="on">฿ THB</button><button data-cur="JPY">¥ JPY</button>
            </div>
          </div>
          <div id="summaryLines"></div>
          <div class="summary-total"><span>รวมโดยประมาณ</span><span id="summaryTotal">฿0</span></div>
          <div class="traveler-row">
            <label for="travelerCount1">หารกับเพื่อนร่วมทาง (คน)</label>
            <input type="number" id="travelerCount1" min="1" max="20" value="1">
          </div>
          <div class="per-person-line" id="perPersonLine1"></div>
          <button class="btn-block" id="btnNext">ดูรายละเอียดทริป</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="common.js"></script>
<script>
let state = loadStateFromURL();
document.getElementById('travelerCount1').value = state.travelerCount;
document.querySelectorAll('.currency-toggle button').forEach(b=>{
  b.classList.toggle('on', b.dataset.cur===state.currency);
});

/* ---- season filter ---- */
const seasonFilterEl=document.getElementById('seasonFilter');
seasons.forEach(s=>{
  const chip=document.createElement('div');
  chip.className='season-chip'+(state.season===s.id?' on':'');
  chip.innerHTML=`<span>${s.ic}</span> ${s.label}`;
  chip.addEventListener('click',()=>{
    state.season=s.id;
    document.querySelectorAll('.season-chip').forEach(c=>c.classList.remove('on'));
    chip.classList.add('on');
    applySeasonFilter();
  });
  seasonFilterEl.appendChild(chip);
});
function applySeasonFilter(){
  document.querySelectorAll('#destGrid .card').forEach(card=>{
    const d=destinations.find(x=>x.id===card.dataset.id);
    const match = state.season==='all' || (d.seasons||[]).includes(state.season);
    card.classList.toggle('dim', !match);
  });
  document.querySelectorAll('#japanMapWrap .map-pin').forEach(pin=>{
    const d=destinations.find(x=>x.id===pin.dataset.id);
    const match = state.season==='all' || (d.seasons||[]).includes(state.season);
    pin.style.opacity = match ? '1' : '.3';
  });
}

/* ---- destination toggle shared by card grid + map ---- */
function toggleDest(id){
  if(state.destIds.has(id)) state.destIds.delete(id); else state.destIds.add(id);
  syncDestSelectionUI();
  refreshSummary();
}
function syncDestSelectionUI(){
  document.querySelectorAll('#destGrid .card').forEach(c=>{
    c.classList.toggle('selected', state.destIds.has(c.dataset.id));
  });
  document.querySelectorAll('#japanMapWrap .map-pin').forEach(p=>{
    p.classList.toggle('selected', state.destIds.has(p.dataset.id));
  });
}

/* ---- card / map view toggle ---- */
document.querySelectorAll('#destViewToggle button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    state.destView=btn.dataset.view;
    document.querySelectorAll('#destViewToggle button').forEach(b=>b.classList.toggle('on', b===btn));
    document.getElementById('destGrid').style.display = state.destView==='card' ? 'grid' : 'none';
    document.getElementById('japanMapWrap').style.display = state.destView==='map' ? 'flex' : 'none';
  });
});

/* ---- stylized Japan map ---- */
function buildJapanMap(){
  const pins=destinations.map(d=>{
    const c=mapCoords[d.id]; if(!c) return '';
    const sel=state.destIds.has(d.id)?' selected':'';
    return `<g class="map-pin${sel}" data-id="${d.id}">
      <circle cx="${c.x}" cy="${c.y}" r="9" fill="#f4c6d0" stroke="#fff" stroke-width="2"/>
      <text x="${c.x+14}" y="${c.y+4}">${d.name}</text>
    </g>`;
  }).join('');
  const svg=`<svg viewBox="0 0 300 480" xmlns="http://www.w3.org/2000/svg">
    <path d="M150,20 C175,15 190,35 182,55 C175,72 195,80 190,105 C230,130 235,170 210,190 C230,215 225,250 195,260 C210,285 195,315 165,320 C175,345 150,370 120,365 C130,390 105,410 80,400 C60,395 55,370 65,355 C45,350 40,325 55,310 C40,300 42,275 60,265 C50,250 58,225 80,220 C68,205 75,180 98,175 C88,158 100,138 122,138 C112,118 125,95 148,98 C138,80 145,55 150,20 Z"
      fill="#dcebd9" stroke="#c3ddc0" stroke-width="1.5"/>
    ${pins}
  </svg>`;
  const wrap=document.getElementById('japanMapWrap');
  wrap.innerHTML=svg;
  wrap.querySelectorAll('.map-pin').forEach(pin=>{
    pin.addEventListener('click',()=>{
      toggleDest(pin.dataset.id);
      pin.classList.remove('pulse'); void pin.getBoundingClientRect(); pin.classList.add('pulse');
    });
  });
}
buildJapanMap();

/* ---- destination cards ---- */
const destGrid=document.getElementById('destGrid');
destinations.forEach(d=>{
  const el=document.createElement('div');
  el.className='card'+(state.destIds.has(d.id)?' selected':'');
  el.dataset.id=d.id;
  const badge=destBadges[d.id] ? `<div class="ribbon">${destBadges[d.id]}</div>` : '';
  el.innerHTML=`<div class="thumb">${badge}<div class="art" style="${artStyle(d)}"></div><div class="check">✓</div></div>
    <div class="body"><h4>${d.name}</h4><p>${d.desc}</p></div>`;
  el.addEventListener('click',()=>{
    toggleDest(d.id);
    el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse');
  });
  destGrid.appendChild(el);
});
applySeasonFilter();

/* ---- hotels ---- */
const hotelList=document.getElementById('hotelList');
hotels.forEach(h=>{
  const el=document.createElement('div');
  el.className='hotel-row'+(state.hotelId===h.id?' selected':'');
  el.innerHTML=`<div class="hotel-thumb"><div class="art" style="${artStyle(h)}"></div></div>
    <div class="hotel-info"><h4>${h.name}</h4><p>${h.desc}</p></div>
    <div class="hotel-price">฿${h.price.toLocaleString()}<small>/คืน</small></div>`;
  el.addEventListener('click',()=>{
    state.hotelId=h.id;
    document.querySelectorAll('.hotel-row').forEach(r=>r.classList.remove('selected'));
    el.classList.add('selected');
    el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse');
    refreshSummary();
  });
  hotelList.appendChild(el);
});

/* ---- transport ---- */
const transportGrid=document.getElementById('transportGrid');
transports.forEach(t=>{
  const el=document.createElement('div');
  el.className='transport-opt'+(state.transportId===t.id?' selected':'');
  el.style.position='relative';
  const badge=transportBadges[t.id] ? `<div class="mini-badge">${transportBadges[t.id]}</div>` : '';
  el.innerHTML=`${badge}<div class="ic">${t.ic}</div><h4>${t.name}</h4><p>${t.desc}</p>`;
  el.addEventListener('click',()=>{
    state.transportId=t.id;
    document.querySelectorAll('.transport-opt').forEach(r=>r.classList.remove('selected'));
    el.classList.add('selected');
    el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse');
    refreshSummary();
  });
  transportGrid.appendChild(el);
});

/* ---- calendar ---- */
let calDate = state.rangeStart ? new Date(state.rangeStart.getFullYear(), state.rangeStart.getMonth(), 1) : new Date(2026,10,1);
function renderCalendar(){
  const grid=document.getElementById('calGrid');
  grid.innerHTML='';
  document.getElementById('calMonthLabel').textContent = monthNamesTh[calDate.getMonth()]+' '+(calDate.getFullYear()+543);
  dowTh.forEach(d=>{
    const el=document.createElement('div'); el.className='dow'; el.textContent=d; grid.appendChild(el);
  });
  const year=calDate.getFullYear(), month=calDate.getMonth();
  const firstDow=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  for(let i=0;i<firstDow;i++){ grid.appendChild(document.createElement('div')); }
  for(let d=1;d<=daysInMonth;d++){
    const el=document.createElement('div');
    el.className='cal-day';
    el.textContent=d;
    const thisDate=new Date(year,month,d);
    if(state.rangeStart && thisDate.getTime()===state.rangeStart.getTime()) el.classList.add('range-edge');
    if(state.rangeEnd && thisDate.getTime()===state.rangeEnd.getTime()) el.classList.add('range-edge');
    if(state.rangeStart && state.rangeEnd && thisDate>state.rangeStart && thisDate<state.rangeEnd) el.classList.add('in-range');
    el.addEventListener('click',()=>{
      if(!state.rangeStart || (state.rangeStart && state.rangeEnd)){
        state.rangeStart=thisDate; state.rangeEnd=null;
      } else if(thisDate<state.rangeStart){
        state.rangeStart=thisDate;
      } else {
        state.rangeEnd=thisDate;
      }
      renderCalendar();
      refreshSummary();
    });
    grid.appendChild(el);
  }
  const label=document.getElementById('calRangeLabel');
  if(state.rangeStart && state.rangeEnd){
    const ns=Math.round((state.rangeEnd-state.rangeStart)/86400000);
    label.innerHTML=`<b>${fmtDate(state.rangeStart)} – ${fmtDate(state.rangeEnd)}</b> · ${ns} คืน`;
  } else if(state.rangeStart){
    label.innerHTML=`เริ่ม <b>${fmtDate(state.rangeStart)}</b> — แตะวันสิ้นสุด`;
  } else {
    label.textContent='แตะวันที่เริ่มต้น แล้วแตะวันที่สิ้นสุดการเดินทาง';
  }
  updateCountdown();
}
function updateCountdown(){
  const el=document.getElementById('countdownLabel');
  if(!state.rangeStart){ el.classList.remove('show'); return; }
  const today=new Date(); today.setHours(0,0,0,0);
  const target=new Date(state.rangeStart); target.setHours(0,0,0,0);
  const diffDays=Math.round((target-today)/86400000);
  if(diffDays>0){
    el.innerHTML=`🕐 อีก <b>${diffDays}</b> วันจะถึงวันเดินทาง!`;
  } else if(diffDays===0){
    el.innerHTML=`✈️ วันนี้แหละ ถึงเวลาออกเดินทางแล้ว!`;
  } else {
    el.innerHTML=`📅 วันที่เลือกผ่านมาแล้ว ${Math.abs(diffDays)} วัน ลองเลือกวันใหม่นะ`;
  }
  el.classList.add('show');
}
document.getElementById('calPrev').addEventListener('click',()=>{ calDate=new Date(calDate.getFullYear(),calDate.getMonth()-1,1); renderCalendar(); });
document.getElementById('calNext').addEventListener('click',()=>{ calDate=new Date(calDate.getFullYear(),calDate.getMonth()+1,1); renderCalendar(); });
renderCalendar();

/* ---- surprise trip randomizer ---- */
function surpriseTrip(){
  const shuffled=[...destinations].sort(()=>Math.random()-0.5);
  const pickCount=1+Math.floor(Math.random()*3);
  const picks=shuffled.slice(0,pickCount);
  state.destIds=new Set(picks.map(d=>d.id));

  const randHotel=hotels[Math.floor(Math.random()*hotels.length)];
  state.hotelId=randHotel.id;
  const randTransport=transports[Math.floor(Math.random()*transports.length)];
  state.transportId=randTransport.id;

  const today=new Date();
  const startOffset=14+Math.floor(Math.random()*150);
  const start=new Date(today); start.setDate(start.getDate()+startOffset); start.setHours(0,0,0,0);
  const tripNights=3+Math.floor(Math.random()*5);
  const end=new Date(start); end.setDate(end.getDate()+tripNights);
  state.rangeStart=start; state.rangeEnd=end;
  calDate=new Date(start.getFullYear(), start.getMonth(), 1);

  syncDestSelectionUI();
  applySeasonFilter();
  document.querySelectorAll('#destGrid .card.selected').forEach(c=>{ c.classList.remove('pulse'); void c.offsetWidth; c.classList.add('pulse'); });
  document.querySelectorAll('.hotel-row').forEach(r=>{
    const sel=r.querySelector('h4').textContent===randHotel.name;
    r.classList.toggle('selected', sel);
    if(sel){ r.classList.remove('pulse'); void r.offsetWidth; r.classList.add('pulse'); }
  });
  document.querySelectorAll('.transport-opt').forEach(r=>{
    const sel=r.querySelector('h4').textContent===randTransport.name;
    r.classList.toggle('selected', sel);
    if(sel){ r.classList.remove('pulse'); void r.offsetWidth; r.classList.add('pulse'); }
  });

  renderCalendar();
  refreshSummary();
}
document.getElementById('btnSurprise').addEventListener('click', surpriseTrip);

/* ---- currency toggle ---- */
document.querySelectorAll('.currency-toggle button').forEach(b=>{
  b.addEventListener('click',()=>{
    state.currency=b.dataset.cur;
    document.querySelectorAll('.currency-toggle button').forEach(x=>x.classList.toggle('on', x.dataset.cur===state.currency));
    refreshSummary();
  });
});

/* ---- traveler split ---- */
function setTravelerCount(val){
  const n=Math.max(1, Math.min(20, parseInt(val,10)||1));
  state.travelerCount=n;
  document.getElementById('travelerCount1').value=n;
  updatePerPerson(state);
}
document.getElementById('travelerCount1').addEventListener('input',e=>setTravelerCount(e.target.value));

/* ---- summary ---- */
function refreshSummary(){
  const b=computeBudget(state);
  document.getElementById('summaryLines').innerHTML=`
    <div class="summary-line"><span>ที่พัก (${b.n} คืน)</span><span>${formatMoney(b.hotelTotal, state.currency)}</span></div>
    <div class="summary-line"><span>การเดินทาง</span><span>${formatMoney(b.transport.price, state.currency)}</span></div>
    <div class="summary-line"><span>สถานที่เพิ่มเติม</span><span>${formatMoney(b.destExtra, state.currency)}</span></div>
  `;
  document.getElementById('summaryTotal').textContent=formatMoney(b.total, state.currency);
  updatePerPerson(state);
}
refreshSummary();

/* ---- go to detail page, carrying selections in the URL ---- */
document.getElementById('btnNext').addEventListener('click', ()=>{
  location.href = linkWithState('detail.html', state);
});

runReveal();
popInStagger('#seasonFilter .season-chip', 45);
popInStagger('#destGrid .card', 55);
popInStagger('#hotelList .hotel-row', 55);
popInStagger('#transportGrid .transport-opt', 55);
</script>
</body>
</html>
